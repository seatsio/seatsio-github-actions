name: "Slack Notify: Types Release Success"
description: |
  Sends a Slack message to #build_status when @seatsio/seatsio-types is released,
  linking each client SDK's bumpSeatsioTypes.yml workflow so the new version can be
  rolled out from Slack.

  This action is specific to @seatsio/seatsio-types — the SDK repos it links are
  hardcoded. Pass the freshly released version so it shows in the message and can be
  pasted into each bump form.

  Note: seatsio-types is released via workflow_dispatch, so no branch check is needed.

inputs:
  webhook_url:
    description: "Slack webhook URL"
    required: true
  version:
    description: "The version of @seatsio/seatsio-types that was just released"
    required: true

runs:
  using: "composite"
  steps:
    - id: map-user
      uses: seatsio/seatsio-github-actions/map-github-user-to-slack@v1

    - uses: slackapi/slack-github-action@v2.0.0
      with:
        webhook: ${{ inputs.webhook_url }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": "✅ `@seatsio/seatsio-types` `${{ inputs.version }}` released. Please bump the SDKs, ${{ steps.map-user.outputs.slack_user }}.",
            "attachments": [
              {
                "color": "good",
                "text": "*Bump `@seatsio/seatsio-types` to `${{ inputs.version }}`:*\n<https://github.com/seatsio/seatsio-angular/actions/workflows/bumpSeatsioTypes.yml|Angular>\n<https://github.com/seatsio/seatsio-react/actions/workflows/bumpSeatsioTypes.yml|React>\n<https://github.com/seatsio/seatsio-react-native/actions/workflows/bumpSeatsioTypes.yml|React Native>\n<https://github.com/seatsio/seatsio-vue/actions/workflows/bumpSeatsioTypes.yml|Vue>"
              }
            ]
          }
