name: "Slack Notify: Build Success"
description: |
  Sends a Slack message to #build_status when a build succeeds.
  Note: This action itself does not check the branch — make sure to restrict it using
  `if: success() && github.ref == 'refs/heads/master'` in your workflow file.

inputs:
  webhook_url:
    description: "Slack webhook URL"
    required: true
  staging_url:
    description: "Optional staging environment link."
    required: false
    default: ""
  deployment_pipeline_app:
    description: "Optional app identifier for the app.seats.io deployment-pipeline link (e.g. WEBAPP, CORE_V2). When set, adds a 'Deploy here' link."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Map GitHub user to Slack user
      id: map-user
      shell: bash
      run: |
        case "${{ github.actor }}" in
          "mroloux")
            echo "slack_user=<@U0ARJS7V1>" >> $GITHUB_OUTPUT
            ;;
          "schaloner")
            echo "slack_user=<@U04GD5VV1MJ>" >> $GITHUB_OUTPUT
            ;;
          "bverbeken")
            echo "slack_user=<@U08TY1PMK>" >> $GITHUB_OUTPUT
            ;;
          "PabloNeirotti")
            echo "slack_user=<@U6TTMGX4G>" >> $GITHUB_OUTPUT
            ;;
          "mortendevold")
            echo "slack_user=<@U04LW9F53HS>" >> $GITHUB_OUTPUT
            ;;
          "sdivelbiss")
            echo "slack_user=<@U090TNSKADS>" >> $GITHUB_OUTPUT
            ;;
          "latviancoder")
            echo "slack_user=<@U0BCF4SD0RK>" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "slack_user=${{ github.actor }}" >> $GITHUB_OUTPUT
            ;;
        esac
    
    - uses: slackapi/slack-github-action@v2.0.0
      with:
        webhook: ${{ inputs.webhook_url }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": "✅ ${{ github.event.repository.name }} build succeeded. Please deploy, ${{ steps.map-user.outputs.slack_user }}.",
            "attachments": [
              {
                "color": "good",
                "text": "*Commit*: <https://github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha || github.sha }}|${{ github.event.workflow_run.head_sha || github.sha }}>${{ inputs.deployment_pipeline_app != '' && format('\n*Deploy*: <https://app.seats.io/admin/deployment-pipeline/{0}|Deploy here>', inputs.deployment_pipeline_app) || '' }}${{ inputs.staging_url != '' && format('\n*Staging*: <{0}|Open staging>', inputs.staging_url) || '' }}"
              }
            ]
          }
