name: "Slack Notify: Client Library Build Success"
description: |
  Sends a Slack message to #build_status when a client library build succeeds,
  linking the manual release workflow.

  Client libraries are released by manually dispatching .github/workflows/release.yml,
  not via the deployment pipeline. Repos that deploy should use slack-notify-build-success.

  Note: This action itself does not check the branch — make sure to restrict it using
  `if: success() && github.ref == 'refs/heads/master'` in your workflow file.

inputs:
  webhook_url:
    description: "Slack webhook URL"
    required: true

runs:
  using: "composite"
  steps:
    - id: map-user
      uses: seatsio/seatsio-github-actions/map-github-user-to-slack@v2

    - uses: slackapi/slack-github-action@v2.0.0
      with:
        webhook: ${{ inputs.webhook_url }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": "✅ ${{ github.event.repository.name }} build succeeded. Please release, ${{ steps.map-user.outputs.slack_user }}.",
            "attachments": [
              {
                "color": "good",
                "text": "*Commit*: <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Release*: <https://github.com/${{ github.repository }}/actions/workflows/release.yml|Release here>"
              }
            ]
          }
